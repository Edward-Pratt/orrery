name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from mod-v* tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            mod/build/libs/gtnhdiscord-*.jar
            !mod/build/libs/*-dev.jar
            !mod/build/libs/*-sources.jar

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type-checks against hub/src/api.ts: an incompatible API change fails here
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/test-restore-backup.sh
