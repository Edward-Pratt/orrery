name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Decides which parts run; see .github/changes.sh for the mapping.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.parts.outputs.hub }}
      mod: ${{ steps.parts.outputs.mod }}
      web: ${{ steps.parts.outputs.web }}
      deploy: ${{ steps.parts.outputs.deploy }}
      agent: ${{ steps.parts.outputs.agent }}
      factorio: ${{ steps.parts.outputs.factorio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/test-changes.sh
      - id: parts
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash # with pipefail, so a failing diff or script fails the job instead of skipping every part
        run: |
          # An empty, all-zeros (new branch) or unfetched (force-push) base isn't a commit here: run everything.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BASE...HEAD" | bash .github/changes.sh # --no-renames: a move lists both sides
          else
            bash .github/changes.sh unknown
          fi | tee -a "$GITHUB_OUTPUT"

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from mod-v* tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck build
      - run: bash ../.github/mod-jars.sh . dist
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/dist/orrery-*.jar

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type-checks against hub/src/api.ts: an incompatible API change fails here
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from agent-v* tags
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck # imports hub/src/types.ts: an incompatible change there fails here
      - run: | # a tarball keeps file modes; its package.json carries the tag's version, which the agent reports
          tag=$(git describe --tags --abbrev=0 --match 'agent-v*' 2>/dev/null || echo agent-v0.0.0)
          bash ../.github/agent-tarball.sh . "${tag#agent-v}" ../agent-dist.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: agent-dist
          path: agent-dist.tar.gz

  factorio:
    needs: changes
    if: needs.changes.outputs.factorio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: | # a factorio-v tag's own version; any other run the changelog's top one (the zip refuses a mismatch)
          if [[ $GITHUB_REF_NAME == factorio-v* ]]; then v=${GITHUB_REF_NAME#factorio-v}
          else v=$(sed -n 's/^Version: *//p' factorio/changelog.txt | head -n 1 | tr -d '\r'); fi
          bash .github/factorio-zip.sh factorio "$v" dist
      - uses: actions/upload-artifact@v4
        with:
          name: factorio-zip
          path: dist/orrery_*.zip

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/test-restore-backup.sh
      - run: bash deploy/test-install-web.sh
      - run: bash deploy/test-deploy.sh
      - run: bash deploy/test-add-server.sh
      - run: bash deploy/test-setup-agent-host.sh
      - run: bash deploy/test-deploy-agent.sh
      - run: bash .github/test-release.sh
