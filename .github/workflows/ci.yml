name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which parts run; see .github/changes.sh for the mapping.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hub: ${{ steps.parts.outputs.hub }}
      mod: ${{ steps.parts.outputs.mod }}
      web: ${{ steps.parts.outputs.web }}
      deploy: ${{ steps.parts.outputs.deploy }}
      agent: ${{ steps.parts.outputs.agent }}
      factorio: ${{ steps.parts.outputs.factorio }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: bash .github/test-changes.sh
      - id: parts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash # with pipefail, so a failing diff or script fails the job instead of skipping every part
        run: |
          # An empty, all-zeros (new branch) or unfetched (force-push) base isn't a commit here: run everything.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BASE...HEAD" | bash .github/changes.sh # --no-renames: a move lists both sides
          else
            bash .github/changes.sh unknown
          fi | tee -a "$GITHUB_OUTPUT"

  # A changed source file over 300 lines needs splitting, or a reason in its first 10 lines: .github/check-file-length.
  file-length:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/check-file-length "$BASE"

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Production runs 24; 26 is the canary, on pushes to main only (not on pull requests).
        node: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '[24, 26]' || '[24]') }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: hub/package.json # no package.json at the root: the version is its packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm lint
      # Until the hub's host has pnpm, the running release's deploy-hub.sh installs a new one with npm: package-lock.json
      # must still agree with package.json. Last, as it replaces pnpm's node_modules.
      - run: npm ci --omit=dev

  mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the version comes from mod-v* tags
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew spotlessCheck build
      - run: bash ../.github/mod-jars.sh . dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mod-jar
          path: mod/dist/orrery-*.jar

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json # no package.json at the root: the version is its packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build # type-checks against hub/src/api.ts: an incompatible API change fails here
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist/web/browser

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the version comes from agent-v* tags
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: agent/package.json # no package.json at the root: the version is its packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck # imports hub/src/types.ts: an incompatible change there fails here
      - run: pnpm lint
      - run: | # a tarball keeps file modes; its package.json carries the tag's version, which the agent reports
          tag=$(git describe --tags --abbrev=0 --match 'agent-v*' 2>/dev/null || echo agent-v0.0.0)
          bash ../.github/agent-tarball.sh . "${tag#agent-v}" ../agent-dist.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-dist
          path: agent-dist.tar.gz

  factorio:
    needs: changes
    if: needs.changes.outputs.factorio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: | # the changelog's top version (a release's zip is built by release.yml, for its tag)
          v=$(sed -n 's/^Version: *//p' factorio/changelog.txt | head -n 1 | tr -d '\r')
          bash .github/factorio-zip.sh factorio "$v" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factorio-zip
          path: dist/orrery_*.zip

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash deploy/test-restore-backup.sh
      - run: bash deploy/test-install-web.sh
      - run: bash deploy/test-deploy.sh
      - run: bash deploy/test-add-server.sh
      - run: bash deploy/test-setup-agent-host.sh
      - run: bash deploy/test-deploy-agent.sh
      - run: bash .github/test-release.sh

  # The one check main's ruleset requires (auto-merge waits for it): the parts above run only when their files
  # changed, and a skipped matrix job reports under another name, so no single part can be the required one.
  ci:
    needs: [changes, file-length, hub, mod, web, agent, factorio, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if grep -qE 'failure|cancelled' <<< "$RESULTS"; then echo "a part failed: $RESULTS"; exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
