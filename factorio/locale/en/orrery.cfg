[mod-name]
orrery=orrery

[mod-description]
orrery=Connects a Factorio server to orrery: chat with Discord, join, leave, death and research posts, firsts (rocket, space platform, planet landings) and Discord account linking. Server-side work only; it adds nothing to the game.

[command-help]
orrery-say=<json> - For the orrery agent over RCON: prints a chat line from Discord or the dashboard.
orrery-notice=<json> - For the orrery agent over RCON: prints a server notice, such as a restart countdown.
orrery-reply=<json> - For the orrery agent over RCON: answers one player's /orrery-link or /orrery-unlink.
orrery-status=- For the orrery agent over RCON: the server's status as JSON.
orrery-hello=- For the orrery agent over RCON: sends the number of the last game event over UDP.
orrery-save=<name> - For the orrery agent over RCON: saves the map as <name>.zip.
orrery-link=<code> - Links your Factorio name to your Discord account. Get the code with /link in Discord.
orrery-unlink=- Unlinks your Factorio name from Discord.

[orrery]
link-usage=Use /orrery-link CODE, with the code /link gave you in Discord.
linking=[Discord] Linking…
