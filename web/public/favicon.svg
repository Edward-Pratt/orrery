<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .orbit { fill: none; stroke: #0d9488; stroke-opacity: .45; stroke-width: 2 }
    .sun { fill: #0d9488 }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #5eead4 }
      .sun { fill: #2dd4bf }
    }
  </style>
  <g transform="rotate(-25 16 16)">
    <ellipse class="orbit" cx="16" cy="16" rx="13.5" ry="6"/>
    <circle class="sun" cx="16" cy="16" r="5.5"/>
    <circle cx="5.2" cy="19.6" r="3.2" fill="#f59e0b"/>
    <circle cx="27.4" cy="12.8" r="1.8" fill="#f97316"/>
  </g>
</svg>
